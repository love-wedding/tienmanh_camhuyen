<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quản lý khách mời</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #342923;
      --muted: #81746a;
      --rose: #a96e63;
      --rose-dark: #87574e;
      --line: #eadfd5;
      --paper: #fffdfa;
      --soft: #f6eee8;
      --green: #477451;
    }
    * { box-sizing: border-box }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 15% 0%, #f3e5dc 0, transparent 38%), linear-gradient(145deg, #fbf8f3, #f1e9e2);
      color: var(--ink);
      font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 64px 24px 72px }
    h1 { margin: 0; font: 500 clamp(30px, 5vw, 43px)/1.15 Georgia, "Times New Roman", serif; letter-spacing: -.035em }
    h1::after { content: ""; display: block; width: 54px; height: 2px; margin: 17px 0 13px; background: #c99f8a }
    h2 { margin: 0; font: 500 22px/1.25 Georgia, "Times New Roman", serif }
    .wrap > .muted { max-width: 580px; color: var(--muted); font-size: 15px }
    .card {
      margin: 22px 0; padding: 28px 30px; border: 1px solid #ebdfd5; border-radius: 18px;
      background: color-mix(in srgb, var(--paper) 94%, transparent); box-shadow: 0 14px 38px #604b3b0b;
    }
    .card:first-of-type h2 { margin-bottom: 20px }
    label { display: inline-block; margin: 0 0 8px; color: #66564c; font-size: 13px; font-weight: 650; letter-spacing: .025em }
    select, textarea {
      display: block; width: 100%; border: 1px solid #dfd1c5; border-radius: 11px; background: #fff;
      color: var(--ink); font: inherit; outline: none; transition: border-color .18s, box-shadow .18s;
    }
    select { width: min(100%, 260px); height: 46px; margin-bottom: 17px; padding: 0 42px 0 14px; cursor: pointer }
    textarea { min-height: 138px; padding: 14px 16px; resize: vertical; line-height: 1.65 }
    textarea::placeholder { color: #ad9f94 }
    select:focus, textarea:focus { border-color: #b98173; box-shadow: 0 0 0 4px #b981731a }
    form button { margin-top: 15px }
    button, .button {
      border: 0; border-radius: 10px; padding: 11px 17px; background: var(--rose); color: white;
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .16s, background .16s, box-shadow .16s;
    }
    button:hover, .button:hover { background: var(--rose-dark); box-shadow: 0 5px 14px #87574e2b; transform: translateY(-1px) }
    button:active, .button:active { transform: translateY(0) }
    button:disabled { opacity: .55; cursor: wait; transform: none }
    .button { display: inline-block; text-decoration: none; padding: 8px 12px; font-size: 13px; white-space: nowrap }
    .secondary { background: var(--soft); color: #604c40 }
    .secondary:hover { background: #eddfd5; color: #49372d }
    .danger { background: #f8e4e1; color: #a12626 }
    .danger:hover { background: #f1cdc8; color: #861c1c; box-shadow: 0 5px 14px #a126262b }
    .actions { display: flex; gap: 8px; flex-wrap: nowrap }
    .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 15px }
    .scroll { overflow-x: auto; border: 1px solid #eee5dd; border-radius: 12px }
    table { width: 100%; border-collapse: collapse; background: #fff; min-width: 620px }
    th, td { text-align: left; padding: 14px 15px; border-bottom: 1px solid #f0e9e3; vertical-align: middle }
    th { background: #faf6f2; color: #7c6c61; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase }
    tbody tr:last-child td { border-bottom: 0 }
    tbody tr:hover { background: #fdfaf7 }
    td:first-child { color: #46372e; font-weight: 600 }
    td a { overflow-wrap: anywhere }
    .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 5px 10px; background: #f3eee9; color: #796b61; font-size: 12px; font-weight: 650; white-space: nowrap }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #b7a99e }
    .status.type-cr { background: #f8e9e6; color: #87574e }
    .status.type-cd { background: #f2eee7; color: #66584c }
    .status.seen { background: #edf5ed; color: var(--green) }
    .status.seen::before { background: #6d9a72 }
    .muted { color: var(--muted) }
    .note { min-height: 22px; margin-top: 13px; color: var(--muted); font-size: 13px }
    .error { color: #a12626 }
    @media (max-width: 600px) {
      .wrap { padding: 36px 15px 48px }
      .card { margin: 15px 0; padding: 21px 18px; border-radius: 15px }
      .row { align-items: flex-start }
      .row h2 { padding-top: 7px }
      .row button { padding: 9px 12px }
      th:nth-child(5), td:nth-child(5) { display: none }
      table { min-width: 560px }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <h1>Quản lý khách mời</h1>
    <div class="muted">Thêm khách, tạo link thiệp riêng và theo dõi lượt mở.</div>
    <section class="card">
      <h2>Thêm khách mời</h2>
      <label for="cardType">Loại thiệp</label>
      <select id="cardType">
        <option value="cd">Thiệp CD</option>
        <option value="cr">Thiệp CR</option>
      </select>
      <form id="addForm">
        <textarea id="guestNames" placeholder="Nhập mỗi tên khách trên một dòng" required maxlength="12000"></textarea>
        <button>Thêm danh sách và tạo link</button>
      </form>
      <div id="notice" class="note muted">Đang tải danh sách…</div>
    </section>
    <section class="card">
      <div class="row">
        <h2>Danh sách khách</h2><button id="reload" class="secondary">Tải lại</button>
      </div>
      <div class="scroll">
        <table>
          <thead>
            <tr>
              <th>Tên khách</th>
              <th>Loại thiệp</th>
              <th>Trạng thái</th>
              <th>Lượt xem</th>
              <th>Lần xem gần nhất</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="guests">
            <tr>
              <td colspan="6" class="muted">Đang tải danh sách…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    (() => {
      // Dán URL API Node trên Render vào đây (không có dấu / ở cuối).
      // Ví dụ: https://guest-tracker-api.onrender.com
      const API_URL = 'https://data-tc3q.onrender.com';

      const $ = s => document.querySelector(s);
      const notice = $('#notice');
      const body = $('#guests');

      function checkConfig() {
        if (!/^https?:\/\//.test(API_URL) || API_URL.includes('TEN-APP')) {
          throw Error('Hãy dán URL API Render vào API_URL trong mã trang.');
        }
      }

      // Loại thiệp lấy từ tiền tố id (cd_… / cr_…); khách cũ không có tiền tố mặc định là CD.
      function cardTypeOf(guest) {
        const match = String(guest.id || '').match(/^(cd|cr)_/i);
        if (match) return match[1].toLowerCase();
        return String(guest.cardType || '').toLowerCase() === 'cr' ? 'cr' : 'cd';
      }

      function formatTime(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return isNaN(d) ? '' : d.toLocaleString('vi-VN');
      }

      // Gọi API; Render gói free có thể mất 30–60 giây để "thức dậy" nên cho chờ tối đa 60 giây.
      async function api(path, options = {}) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 60000);
        try {
          const res = await fetch(API_URL + path, { ...options, signal: controller.signal });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || !data.ok) throw Error(data.error || 'Lỗi máy chủ (' + res.status + ').');
          return data;
        } catch (err) {
          if (err.name === 'AbortError' || err instanceof TypeError) {
            throw Error('Không kết nối được API. Nếu dùng Render gói free, server có thể đang khởi động — thử lại sau ít phút và kiểm tra API_URL.');
          }
          throw err;
        } finally {
          clearTimeout(timer);
        }
      }

      async function load() {
        try {
          checkConfig();
          notice.textContent = 'Đang tải danh sách…';
          notice.className = 'note muted';

          const d = await api('/api/guests');
          body.innerHTML = '';
          if (!d.guests.length) {
            body.innerHTML = '<tr><td colspan="6" class="muted">Chưa có khách mời.</td></tr>';
          }

          d.guests.forEach(g => {
            const type = cardTypeOf(g);
            const link = new URL('../' + type + '/', location.href);
            link.searchParams.set('guest', g.name);

            const tr = document.createElement('tr');

            const name = document.createElement('td');
            name.textContent = g.name;
            tr.append(name);

            const typeCell = document.createElement('td');
            typeCell.innerHTML = '<span class="status type-' + type + '">' + type.toUpperCase() + '</span>';
            tr.append(typeCell);

            const st = document.createElement('td');
            st.innerHTML = g.views > 0
              ? '<span class="status seen">Đã xem</span>'
              : '<span class="status">Chưa xem</span>';
            tr.append(st);

            const count = document.createElement('td');
            count.textContent = g.views || 0;
            tr.append(count);

            const last = document.createElement('td');
            last.textContent = formatTime(g.lastViewed) || '—';
            tr.append(last);

            const cell = document.createElement('td');
            const copy = document.createElement('button');
            copy.className = 'button secondary';
            copy.textContent = 'Sao chép link ' + type.toUpperCase();
            copy.onclick = () => navigator.clipboard.writeText(link.href)
              .then(() => { notice.textContent = 'Đã sao chép link cho ' + g.name; notice.className = 'note muted'; });
            const del = document.createElement('button');
            del.className = 'button danger';
            del.textContent = 'Xóa';
            del.onclick = async () => {
              if (!confirm('Xóa khách "' + g.name + '"? Link thiệp của khách này vẫn mở được nhưng sẽ không còn được theo dõi.')) return;
              del.disabled = true;
              try {
                await api('/api/guests/' + encodeURIComponent(g.id), { method: 'DELETE' });
                await load();
                notice.textContent = 'Đã xóa khách ' + g.name + '.';
                notice.className = 'note muted';
              } catch (err) {
                del.disabled = false;
                notice.textContent = err.message;
                notice.className = 'note error';
              }
            };

            const actions = document.createElement('div');
            actions.className = 'actions';
            actions.append(copy, del);
            cell.append(actions);
            tr.append(cell);

            body.append(tr);
          });

          notice.textContent = 'Đã tải ' + d.guests.length + ' khách mời.';
        } catch (e) {
          notice.textContent = e.message;
          notice.className = 'note error';
        }
      }

      $('#reload').onclick = load;
      $('#cardType').onchange = load;

      $('#addForm').onsubmit = async e => {
        e.preventDefault();
        const button = e.currentTarget.querySelector('button');
        const names = $('#guestNames').value
          .split(/\r?\n/)
          .map(n => n.trim())
          .filter(Boolean);
        if (!names.length) return;

        try {
          checkConfig();
          button.disabled = true;
          notice.textContent = 'Đang lưu ' + names.length + ' khách mời…';
          notice.className = 'note muted';

          const cardType = $('#cardType').value;
          const guests = names.map(n => ({ id: cardType + '_' + crypto.randomUUID(), name: n.slice(0, 120) }));

          const d = await api('/api/guests', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ guests })
          });

          $('#guestNames').value = '';
          await load();
          notice.textContent = 'Đã lưu ' + d.added + ' khách mời.';
          notice.className = 'note muted';
        } catch (err) {
          notice.textContent = err.message;
          notice.className = 'note error';
        } finally {
          button.disabled = false;
        }
      };

      load();
    })();
  </script>
</body>

</html>
